<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" style="background:#0b1120; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="sq-glow-blue" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#087CF5" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sq-glow-mint" cx="70%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#78D6C0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sq-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Logo Gradients -->
    <linearGradient id="sq-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087CF5" />
      <stop offset="100%" stop-color="#0256B8" />
    </linearGradient>
    <linearGradient id="sq-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78D6C0" />
      <stop offset="100%" stop-color="#34B898" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sq-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sq-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <pattern id="sq-dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="#0b1120" />
  <rect width="1080" height="1080" fill="url(#sq-dots)" />

  <!-- Ambient Glows -->
  <circle cx="350" cy="380" r="500" fill="url(#sq-glow-blue)" />
  <circle cx="750" cy="720" r="500" fill="url(#sq-glow-mint)" />

  <!-- Glass Container Card -->
  <rect x="60" y="60" width="960" height="960" rx="36" fill="url(#sq-card)" stroke="#334155" stroke-width="2" filter="url(#sq-shadow)" />

  <!-- Community Header Badge -->
  <g transform="translate(320, 115)">
    <rect width="440" height="42" rx="21" fill="#0f172a" stroke="#087CF5" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#78D6C0" />
    <text x="42" y="27" fill="#E2E8F0" font-size="13" font-weight="700" letter-spacing="1.2">CORPORATE CONNECT EXCLUSIVE</text>
  </g>

  <!-- Center Logo & Infinity Ribbon -->
  <g transform="translate(390, 210) scale(2.5)" filter="url(#sq-neon)">
    <!-- Left Loop -->
    <path
      d="M36 12C20 12 10 22 10 36C10 50 20 60 36 60C50 60 58 48 68 36C58 24 50 12 36 12Z"
      stroke="url(#sq-blue)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Right Loop -->
    <path
      d="M84 12C98 12 110 22 110 36C110 50 98 60 84 60C70 60 62 48 52 36C62 24 70 12 84 12Z"
      stroke="url(#sq-mint)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Bridge -->
    <path
      d="M44 26C52 34 60 42 68 46"
      stroke="url(#sq-blue)"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M52 26C60 34 68 42 76 46"
      stroke="url(#sq-mint)"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Main Wordmark -->
  <g transform="translate(540, 430)">
    <text text-anchor="middle" font-size="76" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Skill</tspan><tspan fill="#087CF5">Sync</tspan>
    </text>
  </g>

  <!-- Tagline Badges -->
  <g transform="translate(310, 480)">
    <g transform="rotate(-1.5)">
      <rect width="215" height="52" rx="14" fill="#020617" stroke="#1e293b" stroke-width="2" />
      <text x="26" y="34" fill="#FFFFFF" font-size="24" font-weight="800">Skills align.</text>
    </g>
    <g transform="translate(235, 0) rotate(1.5)">
      <rect width="220" height="52" rx="14" fill="#087CF5" />
      <text x="26" y="34" fill="#FFFFFF" font-size="24" font-weight="800">Teams thrive.</text>
    </g>
  </g>

  <!-- Value Proposition Bullet Grid -->
  <g transform="translate(140, 580)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="380" height="74" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="45" font-size="22">🚀</text>
      <text x="64" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Hackathon Teaming</text>
      <text x="64" y="55" fill="#94A3B8" font-size="12">SIH, AI challenges, startup squads</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(420, 0)">
      <rect width="380" height="74" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="45" font-size="22">🎯</text>
      <text x="64" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Role Matching</text>
      <text x="64" y="55" fill="#94A3B8" font-size="12">Frontend, Backend, AI/ML, UI/UX</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 95)">
      <rect width="380" height="74" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="45" font-size="22">💬</text>
      <text x="64" y="35" fill="#FFFFFF" font-size="16" font-weight="700">Real-Time Team Chat</text>
      <text x="64" y="55" fill="#94A3B8" font-size="12">Zero latency collaborative channels</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(420, 95)">
      <rect width="380" height="74" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="45" font-size="22">🛡️</text>
      <text x="64" y="35" fill="#FFFFFF" font-size="16" font-weight="700">100% Real Devs</text>
      <text x="64" y="55" fill="#94A3B8" font-size="12">Verified GitHub &amp; skill portfolios</text>
    </g>
  </g>

  <!-- Call to action button -->
  <g transform="translate(340, 785)">
    <rect width="400" height="60" rx="30" fill="#087CF5" filter="url(#sq-neon)" />
    <text x="200" y="38" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" letter-spacing="0.5">
      JOIN &amp; BUILD YOUR DREAM TEAM →
    </text>
  </g>

  <!-- Divider -->
  <line x1="140" y1="880" x2="940" y2="880" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Footer Founder Credit -->
  <g transform="translate(540, 930)">
    <text text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="600">
      Founded by <tspan fill="#78D6C0" font-weight="800">Ramkumar Banavathu</tspan> • SRM University-AP
    </text>
    <text text-anchor="middle" y="24" fill="#64748B" font-size="13">
      Corporate Connect Community Official Release
    </text>
  </g>
</svg>
